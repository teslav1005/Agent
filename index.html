<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Afnan AI - Browser Agent (Gemini 3.1 Flash Lite)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f7f7f9;
            color: #1a1a1a;
            overflow: hidden;
            height: 100vh;
        }

        .smooth-transition {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .soft-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 2px 10px rgba(0, 0, 0, 0.01);
        }

        .deep-shadow {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.01);
        }

        .message-anim {
            animation: slideInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hide-scrollbar::-webkit-scrollbar { width: 4px; }
        .hide-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        
        #screenshotImage { cursor: crosshair; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-4 md:p-6 relative bg-[#f7f7f9]">

    <!-- Header -->
    <header class="w-full max-w-2xl mx-auto flex items-center justify-between py-3 z-40 relative bg-[#f7f7f9]">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-black text-white flex items-center justify-center font-bold text-xs">AI</div>
            <span class="text-sm font-bold text-gray-800">Afnan AI v3</span>
            <div id="statusDot" class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_#10b981]"></div>
        </div>

        <div class="flex items-center gap-3">
            <span class="text-[10px] font-bold text-gray-400 bg-white px-2 py-1 rounded-full soft-shadow">Gemini 3.1 Flash Lite</span>
            <button onclick="toggleSidebar()" class="w-10 h-10 flex flex-col items-end justify-center gap-1.5 px-2 rounded-full hover:bg-white smooth-transition active:scale-95">
                <span class="w-6 h-0.5 bg-black rounded-full block"></span>
                <span class="w-4 h-0.5 bg-black rounded-full block"></span>
            </button>
        </div>
    </header>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 bottom-0 left-0 w-72 bg-white deep-shadow z-50 transform -translate-x-full smooth-transition border-0 flex flex-col justify-between p-5">
        <div class="flex flex-col gap-4">
            <div class="flex items-center justify-between pb-3 border-b border-gray-50">
                <span class="font-bold text-base text-gray-800">القائمة</span>
                <button onclick="toggleSidebar()" class="p-1.5 rounded-xl hover:bg-gray-50"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            <button onclick="startNewChat()" class="w-full flex items-center justify-between p-3.5 bg-gray-50 hover:bg-gray-100 rounded-2xl smooth-transition active:scale-95 text-right">
                <span class="text-sm font-semibold text-gray-800">محادثة جديدة</span>
                <i data-lucide="plus" class="w-5 h-5 text-gray-800"></i>
            </button>
        </div>
        <div class="flex-1 my-4 overflow-y-auto hide-scrollbar space-y-2">
            <div class="text-[11px] font-bold text-gray-400 px-2 tracking-wider">الإعدادات</div>
            <div class="p-3 bg-gray-50 rounded-xl text-xs text-gray-500">
                وضع التخطيط التلقائي: <span class="text-green-600 font-bold">نشط</span>
            </div>
        </div>
    </div>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-[#111112]/40 z-45 transition-all"></div>

    <!-- Main content -->
    <main class="flex-1 w-full max-w-2xl mx-auto flex flex-col justify-start overflow-hidden pb-4 relative z-10">
        <div id="chatContainer" class="flex-1 overflow-y-auto hide-scrollbar px-2 space-y-4 mb-4 flex flex-col justify-start">
            <div id="welcomeScreen" class="my-auto text-center py-12 flex flex-col items-center justify-center space-y-2">
                <h2 class="text-4xl font-light text-gray-300 tracking-wider font-mono">Afnan AI</h2>
                <p class="text-sm text-gray-400">تحكم كامل في المتصفح بتخطيط تلقائي</p>
            </div>
            <div id="chatMessages" class="space-y-4 w-full flex flex-col justify-start"></div>
        </div>

        <!-- Browser overlay (Responsive) -->
        <div id="browserOverlay" class="hidden absolute inset-0 bottom-4 w-full h-[98%] flex flex-col justify-between z-30 message-anim">
            <div class="relative flex-1 bg-white rounded-[2rem] overflow-hidden flex flex-col justify-between soft-shadow border border-gray-100">
                <div class="bg-gray-50 p-3.5 flex items-center justify-between text-[10px] font-mono text-gray-400 border-b border-gray-100">
                    <span id="browserUrl" class="truncate max-w-[80%]">https://www.google.com</span>
                    <div class="flex gap-1">
                        <span class="w-2 h-2 rounded-full bg-red-400"></span>
                        <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
                        <span class="w-2 h-2 rounded-full bg-green-400"></span>
                    </div>
                </div>

                <div class="flex-1 relative flex items-center justify-center bg-gray-50 overflow-hidden">
                    <img id="screenshotImage" src="" class="absolute inset-0 w-full h-full object-contain" onclick="handleManualClick(event)" />
                    <div id="activationOverlay" onclick="activateBrowser()" class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center cursor-pointer smooth-transition z-20">
                        <div class="text-center p-6">
                            <i data-lucide="mouse-pointer" class="w-6 h-6 mx-auto mb-3 text-gray-400"></i>
                            <span class="text-gray-400 font-medium text-sm block">انقر للتفاعل يدوياً</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-center gap-3 mt-3">
                <button onclick="refreshScreenshot()" class="w-10 h-10 rounded-full bg-white hover:bg-gray-50 active:scale-95 smooth-transition flex items-center justify-center text-gray-400 soft-shadow">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
                <button onclick="closeBrowser()" class="w-10 h-10 rounded-full bg-black text-white hover:scale-105 active:scale-95 smooth-transition flex items-center justify-center shadow-lg">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom controls -->
    <div class="w-full max-w-2xl mx-auto space-y-3 z-40 relative">
        <div onclick="toggleBrowser()" class="bg-white rounded-[24px] p-4 flex items-center justify-between soft-shadow cursor-pointer border border-transparent hover:border-gray-100 smooth-transition">
            <div class="flex items-center gap-2">
                <i data-lucide="layout" class="w-5 h-5 text-gray-400"></i>
                <span class="text-gray-700 font-medium text-sm">عرض المتصفح المباشر</span>
            </div>
            <div id="browserIndicator" class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-lg">LIVE</div>
        </div>

        <div class="bg-white rounded-[32px] p-2.5 pl-4 pr-6 flex items-center justify-between deep-shadow border border-gray-50">
            <button onclick="handleSend()" id="sendBtn" class="w-11 h-11 rounded-full bg-black flex items-center justify-center text-white hover:scale-105 active:scale-95 smooth-transition shadow-md">
                <i data-lucide="arrow-up" id="sendIcon" class="w-5 h-5"></i>
                <div id="sendLoading" class="hidden loading-spinner border-white/30 border-t-white"></div>
            </button>

            <div class="flex-1 px-4 text-right">
                <input id="textInput" onkeydown="if(event.key==='Enter') handleSend()" type="text" placeholder="اطلب أي مهمة من الوكيل..." class="w-full bg-transparent border-none outline-none text-right font-medium text-gray-800 placeholder-gray-400 text-sm">
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let socket = io();
        let isBrowserOpen = false;

        socket.on('connect', () => {
            socket.emit('initialize_browser');
            updateStatus('متصل', 'bg-green-500');
        });

        socket.on('browser_initialized', () => {
            addBotMessage('🚀 **تم التحديث!** التصميم الجديد مرن الآن وسأقوم بتنفيذ مهامك بتخطيط تلقائي ذكي.');
            refreshScreenshot();
        });

        socket.on('page_state_update', (data) => {
            document.getElementById('screenshotImage').src = 'data:image/png;base64,' + data.screenshot;
            document.getElementById('browserUrl').innerText = data.domData.pageMeta.url;
        });

        socket.on('bot_message', (data) => {
            setLoading(false);
            addBotMessage(data.text);
        });

        socket.on('agent_status', (data) => {
            if(data.status === 'thinking') {
                updateStatus('يفكر...', 'bg-yellow-500 animate-pulse');
            } else {
                updateStatus('جاهز', 'bg-green-500');
            }
        });

        function handleSend() {
            const input = document.getElementById('textInput');
            const message = input.value.trim();
            if (!message) return;

            addUserMessage(message);
            input.value = '';
            setLoading(true);
            socket.emit('send_message', { message: message });
        }

        function handleManualClick(event) {
            const img = event.target;
            const rect = img.getBoundingClientRect();
            const x = (event.clientX - rect.left) * (img.naturalWidth / rect.width);
            const y = (event.clientY - rect.top) * (img.naturalHeight / rect.height);
            
            socket.emit('log_user_action', { type: 'click', target: `Coordinates (${Math.round(x)}, ${Math.round(y)})` });
            socket.emit('execute_action', { action: { type: 'click', selector: `body`, x: x, y: y } });
            
            setTimeout(refreshScreenshot, 1000);
        }

        function toggleBrowser() {
            const overlay = document.getElementById('browserOverlay');
            isBrowserOpen = !isBrowserOpen;
            if (isBrowserOpen) {
                overlay.classList.remove('hidden');
                refreshScreenshot();
            } else {
                overlay.classList.add('hidden');
            }
        }

        function closeBrowser() {
            isBrowserOpen = false;
            document.getElementById('browserOverlay').classList.add('hidden');
        }

        function activateBrowser() {
            document.getElementById('activationOverlay').classList.add('hidden');
        }

        function refreshScreenshot() {
            socket.emit('get_page_state');
        }

        function addUserMessage(text) {
            const container = document.getElementById('chatMessages');
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = 'flex justify-start message-anim';
            div.innerHTML = `<div class="max-w-[85%] bg-gray-100 rounded-2xl p-3 text-right text-sm text-gray-800 shadow-sm">${text}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addBotMessage(text) {
            const container = document.getElementById('chatMessages');
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = 'flex justify-end message-anim';
            div.innerHTML = `<div class="max-w-[85%] bg-black text-white rounded-2xl p-3 text-right text-sm shadow-md">${text}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function setLoading(loading) {
            document.getElementById('sendIcon').classList.toggle('hidden', loading);
            document.getElementById('sendLoading').classList.toggle('hidden', !loading);
        }

        function updateStatus(text, className) {
            const dot = document.getElementById('statusDot');
            dot.className = `w-2 h-2 rounded-full ${className}`;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isOpen = sidebar.classList.contains('translate-x-0');
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('translate-x-0');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebar.classList.add('translate-x-0');
                overlay.classList.remove('hidden');
            }
        }

        function startNewChat() {
            document.getElementById('chatMessages').innerHTML = '';
            toggleSidebar();
        }
    </script>
</body>
</html>
